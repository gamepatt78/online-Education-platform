<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teacher Login</title>
    <link rel="stylesheet" href="/teacher/css/login.css">
    <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <h2>Teacher Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" name="email" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="password-input">
                    <input type="password" id="loginPassword" name="password" required>
                    <i class="fas fa-eye toggle-password"></i>
                </div>
            </div>
            <div class="form-options">
                <label>
                    <input type="checkbox" id="rememberMe"> Remember me
                </label>
                <a href="/teacher/htmlfiles/forgot-password.html" class="forgot-password">Forgot Password?</a>
            </div>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="/teacher/htmlfiles/register.html">Register</a></p>
    </div>
    <script src="/teacher/js/login.js"></script>
</body>
</html>
