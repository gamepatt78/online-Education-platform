<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7fb">
    <title>Teacher sign in | Online Education</title>
    <link rel="stylesheet" href="/teacher/css/login.css">
    <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
</head>
<body>
    <main class="login-shell">
        <a class="dashboard-link" href="/">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
            Main Dashboard
        </a>

        <section class="login-container" aria-labelledby="loginTitle">
            <div class="login-mark" aria-hidden="true">
                <i class="fas fa-chalkboard-user"></i>
            </div>
            <p class="eyebrow">TEACHER PORTAL</p>
            <h1 id="loginTitle">Welcome back</h1>
            <p class="login-description">Sign in to continue to your teaching workspace.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email address</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope input-icon" aria-hidden="true"></i>
                        <input type="email" id="loginEmail" name="email" autocomplete="username" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrap password-input">
                        <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                        <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" aria-label="Show password">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-option">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="/teacher/htmlfiles/forgot-password.html" class="forgot-password">Forgot password?</a>
                </div>

                <button class="submit-btn" type="submit">
                    <span>Sign in</span>
                    <i class="fas fa-arrow-right" aria-hidden="true"></i>
                </button>
            </form>

            <p class="login-footer">New to teaching here? <a href="/teacher/htmlfiles/register.html">Apply to teach</a></p>
        </section>
        <p class="approval-note"><i class="fas fa-shield-halved" aria-hidden="true"></i> New teacher accounts require administrator approval.</p>
    </main>
    <script src="/teacher/js/login.js"></script>
</body>
</html>
