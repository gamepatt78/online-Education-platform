   <div class="profile">

      <p class="role">student</p>

            </div>
</section>
</header>

<div class="side-bar">

      <i class="fas fa-times"></i>

   <div class="profile">
      <img src="/assets/images/pic-1.jpg" class="image" alt="">

   </div>

     <nav class="navbar">
      <a href="/student/html/home.html"><i class="fas fa-home"></i><span>Home</span></a>

   </nav>
</div>
<section class="feedback-container">
  <div class="feedback-form">
    <h2 class="form-title">We Value Your Feedback</h2>
    <form id="feedbackForm" action="/api/feedback" method="POST">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" class="form-control" name="name" placeholder="Your Name" maxlength="100" required readonly>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" name="email" placeholder="Your Email" maxlength="254" required readonly>
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" class="form-control" name="subject" placeholder="What is your feedback about?" maxlength="120" required>
      </div>
      <div class="form-group">
        <label for="rating">Rating</label>
        <select id="rating" class="form-control" name="rating" required>
          <option value="">-- Select rating --</option>
          <option value="5">Excellent</option>
          <option value="4">Very Good</option>
          <option value="3">Good</option>
          <option value="2">Fair</option>
          <option value="1">Poor</option>
        </select>
      </div>
      <div class="form-group">
        <label for="feedback">Your Feedback</label>
        <textarea id="feedback" class="form-control" name="feedback" maxlength="2000" placeholder="Please share your thoughts, suggestions, or concerns..." required></textarea>
      </div>
      <div class="submit-btn-container">
        <button type="submit" class="submit-btn">Submit</button>
      </div>
      <p id="feedback-status" class="feedback-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

<div id="popupModal" class="popup-modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="feedback-success-title">
    <div class="popup-content">
        <button type="button" class="close-btn" id="closePopupBtn" aria-label="Close confirmation">&times;</button>
        <h2 id="feedback-success-title">Thank You!</h2>
        <p>Your feedback has been submitted successfully. We appreciate your input!</p>
    </div>
</div>

<script src="/student/js/pages/feedback-popup.js"></script>
<script src="/student/js/shared/script.js"></script>
</body>
</html>
