<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Online Education Portal</title>

  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/student/css/base/theme.css">
  <link rel="stylesheet" href="/student/css/layouts/style.css">

  <style>
    body {
      background: radial-gradient(circle at 50% 0%, rgba(79, 70, 229, 0.08) 0%, transparent 60%), var(--bg-page);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.6rem;
    }
    .fp-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 4rem 3.6rem;
      box-shadow: var(--shadow-xl);
      text-align: center;
      position: relative;
    }
    .fp-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      border-top-left-radius: var(--radius-xl);
      border-top-right-radius: var(--radius-xl);
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }
    .fp-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      background: var(--primary-subtle);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 2rem;
    }
    .fp-card h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.8rem;
    }
    .fp-card p {
      font-size: 1.4rem;
      color: var(--text-secondary);
      margin-bottom: 2.4rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 2rem;
    }
    .form-group label {
      display: block;
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
    }
    .submit-btn {
      width: 100%;
      padding: 1.2rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .submit-btn:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body class="no-sidebar">

<div class="fp-card">
  <div class="fp-icon">
    <i class="fas fa-key"></i>
  </div>
  <h1>Forgot Password?</h1>
  <p>Enter the email address registered with your student account and we will generate a recovery link.</p>

  <form id="forgotForm">
    <div class="form-group">
      <label for="email">Account Email</label>
      <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
    </div>
    <button type="submit" class="submit-btn" id="fpBtn">Send Recovery Link</button>
  </form>
  <div id="fp-error" role="status" aria-live="polite"></div>

  <div style="margin-top: 2rem; font-size: 1.4rem;">
    <a href="/student/html/login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
  </div>
</div>

<script>
  document.getElementById('forgotForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('fpBtn');
    const message = document.getElementById('fp-error');
    btn.disabled = true;
    btn.textContent = 'Verifying...';
    message.textContent = '';

    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value.trim() })
      });
      const data = await res.json();
      if (!res.ok || !data.success) {
        throw new Error(data.message || 'Password reset is unavailable.');
      }
      message.textContent = data.message;
    } catch (err) {
      message.textContent = err.message || 'Password reset is unavailable. Please contact support.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send Recovery Link';
    }
  });
</script>
</body>
</html>
