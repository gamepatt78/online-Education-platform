<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Online Education Portal</title>

  <!-- Font Awesome icons -->
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
  <!-- Modern Design System -->
  <link rel="stylesheet" href="/student/css/base/theme.css">
  <link rel="stylesheet" href="/student/css/layouts/style.css">

  <style>
    body {
      background: radial-gradient(circle at 50% 0%, rgba(79, 70, 229, 0.08) 0%, transparent 60%), var(--bg-page);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.6rem;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 4rem 3.6rem;
      box-shadow: var(--shadow-xl);
      position: relative;
      animation: fadeIn 0.3s ease;
    }

    .auth-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      border-top-left-radius: var(--radius-xl);
      border-top-right-radius: var(--radius-xl);
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .auth-logo-badge {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      background: var(--primary-subtle);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin: 0 auto 1.6rem;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 3.2rem;
    }

    .auth-header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
    }

    .auth-header p {
      font-size: 1.45rem;
      color: var(--text-secondary);
    }

    .form-group {
      margin-bottom: 2rem;
    }

    .form-group label {
      display: block;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.8rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i.prefix-icon {
      position: absolute;
      left: 1.6rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.5rem;
    }

    .form-control {
      width: 100%;
      padding: 1.2rem 1.6rem 1.2rem 4.4rem;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      font-size: 1.45rem;
      background: var(--bg-card);
      color: var(--text-main);
      transition: all var(--transition-fast);
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .password-toggle {
      position: absolute;
      right: 1.6rem;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.5rem;
      transition: color var(--transition-fast);
    }

    .password-toggle:hover {
      color: var(--text-main);
    }

    .auth-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.4rem;
      font-size: 1.35rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      padding: 1.2rem;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1.5rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px var(--primary-glow);
      transform: translateY(-1px);
    }

    .submit-btn.loading {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .form-footer {
      margin-top: 2.4rem;
      text-align: center;
      font-size: 1.4rem;
      color: var(--text-secondary);
      padding-top: 2rem;
      border-top: 1px solid var(--border-light);
    }

    .demo-credentials-box {
      margin-top: 2rem;
      padding: 1.2rem 1.6rem;
      background: var(--primary-subtle);
      border-radius: var(--radius-md);
      font-size: 1.3rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .demo-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-sm);
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="login-page">

<div class="auth-container">
  <div class="auth-logo-badge">
    <i class="fas fa-graduation-cap"></i>
  </div>

  <div class="auth-header">
    <h1>Welcome back</h1>
    <p>Sign in to access your courses and exams</p>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email Address</label>
      <div class="input-wrapper">
        <i class="fas fa-envelope prefix-icon"></i>
        <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <i class="fas fa-lock prefix-icon"></i>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        <i class="fas fa-eye password-toggle" id="password-toggle"></i>
      </div>
    </div>

    <div class="auth-options">
      <label class="remember-me">
        <input type="checkbox" id="remember" checked>
        <span>Remember me</span>
      </label>
      <a href="/student/html/forgot-password.html">Forgot Password?</a>
    </div>

    <button type="submit" class="submit-btn" id="loginBtn">
      <span>Sign In</span>
      <i class="fas fa-arrow-right"></i>
    </button>
  </form>

  <div class="form-footer">
    Don't have an account? <a href="/student/html/register.html"><strong>Register now</strong></a>
  </div>
</div>

<script src="/student/js/auth/login.js"></script>
<script src="/student/js/shared/script.js"></script>
</body>
</html>
